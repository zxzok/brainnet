version: 1
mode: sequential-single-task
source_docs:
  - docs/IMPLEMENTATION_GAP_AUDIT.md
  - docs/DEVELOPMENT_TASK_PROMPTS.md
rules:
  - one_agent_one_task
  - strict_sequential_order
  - handoff_required_before_next_agent
  - minimal_safe_change_only
  - do_not_implement_future_tasks_early
agents:
