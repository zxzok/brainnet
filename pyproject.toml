[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainnet"
version = "0.1.0"
description = "Modular fMRI preprocessing and connectivity analysis platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=2.3,<4",
  "networkx>=3.2",
  "nibabel>=5.2",
  "nilearn>=0.10",
  "numpy>=1.26",
  "openneuro-py>=2024.2.0",
  "pandas>=2.0",
  "plotly>=5.18",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
]
download = [
  "datalad>=0.19",
]
hmm = [
  "hmmlearn>=0.3.2",
]
llm = [
  "openai>=1.0",
  "anthropic>=0.40",
]

[project.scripts]
brainnet-cli = "brainnet.main:main"
brainnet-web = "brainnet.web_app:main"

[tool.setuptools]
packages = ["brainnet", "brainnet.dynamic", "brainnet.static"]
include-package-data = true

[tool.setuptools.package-dir]
brainnet = "."
"brainnet.dynamic" = "dynamic"
"brainnet.static" = "static"

[tool.setuptools.package-data]
brainnet = ["templates/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
