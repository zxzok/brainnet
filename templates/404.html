{% extends "base.html" %}
{% block title %}Not Found - BrainNet{% endblock %}

{% block content %}
<div class="page-container">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center;">
        <div style="font-family: var(--mono); font-size: 5rem; font-weight: 700; color: var(--text-ghost); line-height: 1; margin-bottom: 16px;">404</div>
        <h2 style="font-size: 1.2rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Page Not Found</h2>
        <p style="color: var(--text-tertiary); font-size: 0.9rem; margin-bottom: 24px;">The requested resource does not exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
{% endblock %}
