{% extends "base.html" %}
{% block title %}Server Error - BrainNet{% endblock %}

{% block content %}
<div class="page-container">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center;">
        <div style="font-family: var(--mono); font-size: 5rem; font-weight: 700; color: var(--accent-rose); line-height: 1; margin-bottom: 16px; opacity: 0.4;">500</div>
        <h2 style="font-size: 1.2rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">Something Went Wrong</h2>
        <p style="color: var(--text-tertiary); font-size: 0.9rem; margin-bottom: 24px;">An internal error occurred. Please try again or check the system status.</p>
        <div style="display: flex; gap: 10px;">
            <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <a href="{{ url_for('system_status') }}" class="btn btn-ghost"><i class="fas fa-cog"></i> System Status</a>
        </div>
    </div>
</div>
{% endblock %}
