{% extends "base.html" %}
{% block title %}分析 - BrainNet{% endblock %}

{% block head %}
<style>
    .analysis-card {
        position: relative;
        overflow: hidden;
    }
    .analysis-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-violet));
        opacity: 0;
        transition: opacity var(--transition-default);
    }
    .analysis-card:hover::before { opacity: 1; }

    .chart-container {
        position: relative;
        background: var(--bg-deep);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        padding: 20px;
        margin-top: 16px;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div>
            <h1><i class="fas fa-chart-line"></i>分析</h1>
            <p class="page-subtitle">静态与动态连接性分析结果</p>
        </div>
        <a href="/chat" class="btn btn-primary">
            <i class="fas fa-comments"></i> 通过 AI 对话运行
        </a>
    </div>

    <div class="grid grid-2 mb-lg">
        <div class="card analysis-card">
            <div class="card-body">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
                    <div style="width: 36px; height: 36px; border-radius: 10px; background: var(--accent-cyan-glow); display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-project-diagram" style="color: var(--accent-cyan);"></i>
                    </div>
                    <div>
                        <div class="card-title" style="margin-bottom: 0;">静态连接性</div>
                        <div style="font-size: 0.78rem; color: var(--text-tertiary);">Pearson 相关矩阵</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="staticChart" height="200"></canvas>
                </div>
            </div>
        </div>

        <div class="card analysis-card">
            <div class="card-body">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
                    <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(74, 142, 255, 0.1); display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-wave-square" style="color: var(--accent-blue);"></i>
                    </div>
                    <div>
                        <div class="card-title" style="margin-bottom: 0;">动态分析</div>
                        <div style="font-size: 0.78rem; color: var(--text-tertiary);">时间状态转换</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="dynamicChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body" style="text-align: center; padding: 40px;">
            <p style="color: var(--text-tertiary); font-size: 0.9rem; margin-bottom: 16px;">
                通过 AI 编排器运行分析以在此查看结果，或上传被试数据进行自动处理。
            </p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <a href="/chat" class="btn btn-primary"><i class="fas fa-comments"></i> 开始 AI 分析对话</a>
                <a href="{{ url_for('patients') }}" class="btn btn-ghost"><i class="fas fa-users"></i> 查看被试</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
Chart.defaults.color = '#5a6378';
Chart.defaults.borderColor = 'rgba(100, 180, 220, 0.06)';
Chart.defaults.font.family = "'DM Sans', sans-serif";

var staticCtx = document.getElementById('staticChart').getContext('2d');
new Chart(staticCtx, {
    type: 'bar',
    data: {
        labels: ['Degree', 'Clustering', 'Efficiency', 'Modularity', 'Betweenness'],
        datasets: [{
            label: 'Metric Value',
            data: [0.42, 0.38, 0.71, 0.55, 0.29],
            backgroundColor: 'rgba(56, 217, 197, 0.3)',
            borderColor: 'rgba(56, 217, 197, 0.6)',
            borderWidth: 1,
            borderRadius: 4
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
            y: { beginAtZero: true, grid: { color: 'rgba(100, 180, 220, 0.04)' } },
            x: { grid: { display: false } }
        }
    }
});

var dynCtx = document.getElementById('dynamicChart').getContext('2d');
new Chart(dynCtx, {
    type: 'line',
    data: {
        labels: Array.from({length: 20}, function(_, i) { return 'T' + (i+1); }),
        datasets: [{
            label: 'State Transitions',
            data: [1,1,2,2,2,3,3,1,1,2,3,3,3,2,1,1,1,2,2,3],
            borderColor: 'rgba(74, 142, 255, 0.8)',
            backgroundColor: 'rgba(74, 142, 255, 0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3,
            pointBackgroundColor: 'rgba(74, 142, 255, 0.8)'
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
            y: { grid: { color: 'rgba(100, 180, 220, 0.04)' }, ticks: { stepSize: 1 } },
            x: { grid: { display: false } }
        }
    }
});
</script>
{% endblock %}
