{% extends "base.html" %}
{% block title %}编辑被试 - BrainNet{% endblock %}

{% block content %}
<div class="page-container" style="max-width: 640px;">
    <div class="page-header">
        <div>
            <h1><i class="fas fa-user-edit"></i>编辑被试</h1>
            <p class="page-subtitle">更新被试信息</p>
        </div>
        <a href="{{ url_for('patient_detail', patient_id=patient[0]) }}" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_patient', patient_id=patient[0]) }}">
                <div class="form-group">
                    <label class="form-label" for="patient_id">被试编号</label>
                    <input type="text" class="form-input" id="patient_id" name="patient_id" value="{{ patient[1] }}" required readonly style="opacity: 0.6; cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label class="form-label" for="name">姓名 <span style="color: var(--accent-rose);">*</span></label>
                    <input type="text" class="form-input" id="name" name="name" value="{{ patient[2] }}" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="age">年龄</label>
                        <input type="number" class="form-input" id="age" name="age" value="{{ patient[3] or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="sex">性别</label>
                        <select class="form-input" id="sex" name="sex">
                            <option value="">请选择...</option>
                            <option value="M" {% if patient[4] == 'M' %}selected{% endif %}>男</option>
                            <option value="F" {% if patient[4] == 'F' %}selected{% endif %}>女</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="diagnosis">诊断</label>
                    <input type="text" class="form-input" id="diagnosis" name="diagnosis" value="{{ patient[5] or '' }}">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
                    <a href="{{ url_for('patient_detail', patient_id=patient[0]) }}" class="btn btn-ghost">取消</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 更新被试</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
