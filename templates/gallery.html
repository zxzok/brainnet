{% extends "base.html" %}

{% block title %}影像库 - BrainNet MRI 数据管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">MRI 影像库</h1>
</div>

<div class="row">
    {% if images %}
        {% for image in images %}
        <div class="col-md-3 mb-4">
            <div class="card h-100">
                <img src="/{{ image[1] }}" class="card-img-top" alt="MRI 影像" style="object-fit:cover; height:200px;">
                <div class="card-body">
                    <h6 class="card-title">{{ image[2] or '未知类型' }}</h6>
                    <p class="card-text">{{ image[4] or '' }}</p>
                    <a href="/{{ image[1] }}" target="_blank" class="btn btn-sm btn-outline-primary">查看原图</a>
                </div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="col-12 text-center">
            <p>未找到影像。</p>
        </div>
    {% endif %}
</div>
{% endblock %}
